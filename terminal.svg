<svg width="700" height="350" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <style>
      .terminal {
        font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", monospace;
      }

      .prompt {
        fill: #4e7a7a;
      }

      .path {
        fill: #4e6a9a;
      }

      .command {
        fill: #999999;
      }

      .output {
        fill: #ffffff;
      }

      .email {
        fill: #ffffff;
        text-decoration: none;
        cursor: pointer;
      }

      .email:hover {
        fill: #7aa2f7;
        text-decoration: underline;
      }

      .cursor {
        fill: #ffffff;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </defs>

  <rect
    x="8"
    y="8"
    width="684"
    height="334"
    rx="12"
    fill="#0a0a0a"
    filter="url(#shadow)"
  />

  <rect
    x="8"
    y="8"
    width="684"
    height="334"
    rx="12"
    fill="none"
    stroke="#1f1f1f"
  />

  <rect
    x="8"
    y="8"
    width="684"
    height="42"
    rx="12"
    fill="#111111"
  />

  <rect
    x="8"
    y="38"
    width="684"
    height="12"
    fill="#111111"
  />

  <line
    x1="8"
    y1="50"
    x2="692"
    y2="50"
    stroke="#191919"
  />

  <circle cx="28" cy="29" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="29" r="6" fill="#febc2e"/>
  <circle cx="68" cy="29" r="6" fill="#28c840"/>

  <text
    x="350"
    y="34"
    text-anchor="middle"
    fill="#555555"
    font-size="12"
    class="terminal"
  >
    vahid@github: ~
  </text>

  <g class="terminal" font-size="14">

    <text x="28" y="84" class="prompt">vahid@github</text>
    <text x="125" y="84" class="path">:~$</text>
    <text x="160" y="84" class="command">echo $USER</text>

    <text x="28" y="108" class="output">vahid</text>


    <text x="28" y="146" class="prompt">vahid@github</text>
    <text x="125" y="146" class="path">:~$</text>
    <text x="160" y="146" class="command">cat /etc/email</text>

    <a href="mailto:VahidSiyami.dev@gmail.com">
      <text x="28" y="170" class="email">
        vahidsiyami.dev@gmail.com
      </text>
    </a>


    <text x="28" y="208" class="prompt">vahid@github</text>
    <text x="125" y="208" class="path">:~$</text>
    <text x="160" y="208" class="command">cat /etc/status</text>

    <text x="28" y="232" class="output">
      learning → building → improving
    </text>


    <text x="28" y="270" class="prompt">vahid@github</text>
    <text x="125" y="270" class="path">:~$</text>

    <rect
      x="160"
      y="256"
      width="8"
      height="16"
      rx="1"
      class="cursor"
    />

  </g>
</svg>
